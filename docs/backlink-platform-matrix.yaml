# Project-specific verification snapshot. Unknown values are not publication passes.
schema_version: 1
field_rules:
  boolean_or_unknown: "Use true, false, or unknown. Unknown fails a hard gate until verified."
  expected_referring_domain_yield: "Unique root domains expected from one asset; mirrors count only after individual audits."
  verification_status: "candidate, verified, rejected, or blocked."

platforms:
