    root_domain: npmjs.com
    ecosystem: JavaScript and TypeScript
    supported_asset_types: [CLI, config package]
    self_publish: true
    public_detail_page: true
    indexable_verified: true
    contextual_body_copy_supported: unknown
    custom_anchor_supported: false
    ordinary_follow_verified: true
    metadata_link_rel: "No blocking rel reported during owner verification"
    body_link_rel: unknown
    cli_publish_support: true
    api_publish_support: unknown
    github_actions_support: true
    moderation_required: false
    account_creation_difficulty: medium
    namespace_requirement: true
    token_api_key_requirement: true
    automatic_documentation_generation: true
    automatic_mirrors_indexes: true
    expected_referring_domain_yield: 4
    last_verified_date: 2026-08-09
    representative_detail_page: https://www.npmjs.com/package/zoxide-doctor
    publication_instructions: "Publish the tested tagged package through GitHub Actions with trusted publishing or a scoped npm token."
    verification_notes: "v0.1.0 is public and its Homepage metadata points to the zoxide-doctor guide."
    blocked_rejected_reason: null
    verification_status: verified

